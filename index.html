<!DOCTYPE html>
<!--
  @file index.html
  @description 应用主 HTML 入口，预加载 Vditor 离线图标与中文语言包，并初始化本地昼夜主题防闪烁脚本
  @module 应用入口与基础框架
-->
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarkForge</title>
    <!-- Preload i18n and SVG icon sprites so all tooltips and icons work offline and immediately -->
    <script defer src="./vditor/dist/js/icons/ant.js"></script>
    <script defer src="./vditor/dist/js/i18n/zh_CN.js"></script>
    <script>
      (function() {
        const theme = localStorage.getItem('markforge-theme') || 'dark';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-canvas text-primary antialiased select-none overflow-hidden m-0 p-0">
    <div id="root" class="w-screen h-screen overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
